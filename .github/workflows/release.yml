name: Build Plugin Release

on:
  workflow_dispatch:
  release:
    types: [created, published]

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create plugin zip
        run: |
          # Create a temporary directory for the plugin
          mkdir -p /tmp/wp-abilities-api-demo

          # Copy plugin files (exclude development files)
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='vendor' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='node_modules' \
            ./ /tmp/wp-abilities-api-demo/

          # Create zip file
          cd /tmp
          zip -r wp-abilities-api-demo.zip wp-abilities-api-demo

          # Move zip to workspace
          mv wp-abilities-api-demo.zip $GITHUB_WORKSPACE/

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./wp-abilities-api-demo.zip
          asset_name: wp-abilities-api-demo.zip
          asset_content_type: application/zip

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wp-abilities-api-demo-${{ github.run_number }}
          path: ./wp-abilities-api-demo.zip
          retention-days: 30
